<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Issue Book | Library Management System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f9;
            color: #333;
            padding: 30px 15px;
        }

        .container {
            max-width: 650px;
            margin: 30px auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            color: #263b5e;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        .error-message {
            background: #ffe5e5;
            color: #c62828;
            border: 1px solid #ef9a9a;
            padding: 13px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
        }

        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            background: white;
        }

        select:focus {
            outline: none;
            border-color: #3157a4;
            box-shadow: 0 0 4px rgba(49, 87, 164, 0.3);
        }

        .hint {
            display: block;
            color: #777;
            font-size: 12px;
            margin-top: 6px;
        }

        .issue-btn {
            width: 100%;
            background: #3157a4;
            color: white;
            padding: 13px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .issue-btn:hover {
            background: #233f7a;
        }

        .links {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 22px;
        }

        .links a {
            text-decoration: none;
            color: #3157a4;
            font-size: 14px;
        }

        .links a:hover {
            text-decoration: underline;
        }

        @media (max-width: 500px) {
            .container {
                padding: 22px;
            }

            .links {
                flex-direction: column;
                gap: 15px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Issue a Book</h1>

        <p class="subtitle">
            Select a book and the member who will borrow it.
        </p>

        {% if error %}
        <div class="error-message" role="alert">
            <strong>Error:</strong> {{ error }}
        </div>
        {% endif %}

        <form action="{{ url_for('issue_book') }}" method="POST">

            <div class="form-group">
                <label for="book_id">Select Book</label>

                <select id="book_id" name="book_id" required>
                    <option value="">-- Select an available book --</option>

                    {% for book in books %}
                    <option
                        value="{{ book.book_id }}"
                        {% if book_id|string == book.book_id|string %}selected{% endif %}
                    >
                        ID: {{ book.book_id }} -
                        {{ book.title }} by {{ book.author }}
                    </option>
                    {% endfor %}

                </select>

                <span class="hint">
                    Only available books are listed here.
                </span>
            </div>

            <div class="form-group">
                <label for="member_id">Select Member</label>

                <select id="member_id" name="member_id" required>
                    <option value="">-- Select a member --</option>

                    {% for member in members %}
                    <option
                        value="{{ member.member_id }}"
                        {% if member_id|string == member.member_id|string %}selected{% endif %}
                    >
                        ID: {{ member.member_id }} -
                        {{ member.name }}
                    </option>
                    {% endfor %}

                </select>

                <span class="hint">
                    Select the member who wants to borrow the book.
                </span>
            </div>

            <button type="submit" class="issue-btn">
                Issue Book
            </button>

        </form>

        <div class="links">
            <a href="{{ url_for('books') }}">← View Books</a>

            <a href="{{ url_for('issued') }}">
                View Issued Books →
            </a>

            <a href="/">← Dashboard</a>
        </div>

    </div>

</body>
</html>
