<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Book | Library Management System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1e293b;
        }

        .container {
            max-width: 750px;
            margin: 50px auto;
            padding: 20px;
        }

        .header {
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .header p {
            color: #64748b;
            font-size: 14px;
        }

        .form-card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .error-message {
            background: #fee2e2;
            color: #b91c1c;
            border: 1px solid #f87171;
            padding: 13px 15px;
            border-radius: 8px;
            margin-bottom: 22px;
            font-size: 14px;
            font-weight: bold;
        }

        .success-message {
            background: #dcfce7;
            color: #166534;
            border: 1px solid #86efac;
            padding: 13px 15px;
            border-radius: 8px;
            margin-bottom: 22px;
            font-size: 14px;
            font-weight: bold;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 22px;
            border-radius: 7px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .back-button {
            display: inline-block;
            background: #e2e8f0;
            color: #334155;
            padding: 12px 22px;
            border-radius: 7px;
            text-decoration: none;
            font-size: 15px;
            font-weight: bold;
        }

        .back-button:hover {
            background: #cbd5e1;
        }

        .required {
            color: #dc2626;
        }

        @media (max-width: 600px) {
            .container {
                margin: 20px auto;
                padding: 15px;
            }

            .form-card {
                padding: 20px;
            }

            .button-group {
                flex-direction: column;
            }

            button,
            .back-button {
                text-align: center;
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>Add New Book</h1>
            <p>Enter the book details to add it to the library.</p>
        </div>

        <div class="form-card">

            <!-- ERROR MESSAGE -->
            {% if error %}
            <div class="error-message" role="alert">
                {{ error }}
            </div>
            {% endif %}

            <!-- SUCCESS MESSAGE -->
            {% if success %}
            <div class="success-message" role="status">
                {{ success }}
            </div>
            {% endif %}

            <!-- ADD BOOK FORM -->
            <form action="{{ url_for('add_book_page') }}" method="POST">

                <div class="form-group">
                    <label for="title">
                        Book Title <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        id="title"
                        name="title"
                        placeholder="Enter book title"
                        value="{{ title|default('') }}"
                    >
                </div>

                <div class="form-group">
                    <label for="author">
                        Author Name <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        id="author"
                        name="author"
                        placeholder="Enter author name"
                        value="{{ author|default('') }}"
                    >
                </div>

                <div class="form-group">
                    <label for="category">Category</label>

                    <input
                        type="text"
                        id="category"
                        name="category"
                        placeholder="Example: Programming, Fiction"
                        value="{{ category|default('') }}"
                    >
                </div>

                <div class="button-group">

                    <button type="submit">
                        Add Book
                    </button>

                    <a href="{{ url_for('books') }}" class="back-button">
                        View Books
                    </a>

                </div>

            </form>

        </div>

    </div>

</body>
</html>
